            build:
              commands:
                - echo "build"
                - bash ./toolchain/scripts/compile.sh
            post_build:
              commands:
                - echo "post_build start"




  ##################### Code Build Projects (Linux)


  ############### Pipeline

  AutoUpdateCodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RestartExecutionOnUpdate: true
      Name: !Sub ${AWS::StackName}-autoupdatecodepipeline
      RoleArn: !GetAtt AutoUpdateCodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsS3Bucket
      Stages: 
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                BranchName: !Ref BranchName
                RepositoryName: !GetAtt LocalCodeCommit.Name
                PollForSourceChanges: false
              RunOrder: 1

        - Name: AutoUpdate
          Actions:
            - Name: Validate
              ActionTypeId:
                Category: Build
                Provider: CodeBuild
                Owner: AWS
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: ValidateArtifact
              Configuration:
                ProjectName: !Ref ValidateCodeBuildProject
              RunOrder: 1

            - Name: AutoUpdate
              ActionTypeId:
                Category: Build
                Provider: CodeBuild
                Owner: AWS
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: AutoUpdateArtifact
              Configuration:
                ProjectName: !Ref AutoUpdateCodeBuildProject
              RunOrder: 2

        - Name: PreBuildStage
          Actions:

            - Name: SCA
              ActionTypeId:
                Category: Build
                Provider: CodeBuild
                Owner: AWS
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: SCAArtifact
              Configuration:
                ProjectName: !Ref SCACodeBuildProject
              RunOrder: 1

        
        - Name: BuildService
          Actions:
            - Name: Compile
              ActionTypeId:
                Category: Build
                Provider: CodeBuild
                Owner: AWS
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: CompileArtifact
              Configuration:
                ProjectName: !Ref CompileCodeBuildProject
              RunOrder: 1

        - Name: TestStage
          Actions:
            - Name: DeployInfra
              ActionTypeId:
                Category: Build
                Provider: CodeBuild
                Owner: AWS
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: DeployInfraArtifact
              Configuration:
                ProjectName: !Ref DeployInfraCodeBuildProject
              RunOrder: 1

            - Name: DeployDB
              ActionTypeId:
                Category: Build
                Provider: CodeBuild
                Owner: AWS
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: DeployDBArtifact
              Configuration:
                ProjectName: !Ref DeployDBCodeBuildProject
              RunOrder: 2

            - Name: DeploySoftware
              ActionTypeId:
                Category: Build
                Provider: CodeBuild
                Owner: AWS
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: DeploySoftwareArtifact
              Configuration:
                ProjectName: !Ref DeploySoftwareCodeBuildProject
              RunOrder: 3


  ############# Pipeline


  AutoUpdateEventRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        -
          PolicyName: eb-pipeline-execution
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: 
                  - !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${AutoUpdateCodePipeline}
                
  AutoUpdateEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - 'CodeCommit Repository State Change'
        resources: 
          - !Sub "arn:${AWS::Partition}:codecommit:${AWS::Region}:${AWS::AccountId}:${CodeCommitName}"
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - !Ref BranchName
      Targets:
        -
          Arn: 
            !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${AutoUpdateCodePipeline}
          RoleArn: !GetAtt AutoUpdateEventRole.Arn
          Id: codepipeline-AutoUpdateCodePipeline
