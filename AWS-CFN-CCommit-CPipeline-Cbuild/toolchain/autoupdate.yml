  CompileCodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AWS::StackName}-compilecodebuildproject
      Description: Deploy step
      ServiceRole: !GetAtt AutoUpdateCodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
