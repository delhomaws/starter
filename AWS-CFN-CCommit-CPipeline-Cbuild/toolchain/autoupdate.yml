          - Name: ArtifactsS3Bucket
            Value: !Ref ArtifactsS3Bucket
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.13
              commands:
                - echo "install"
            pre_build:
              commands:
              - echo "pre_build"
            build:
              commands:
                - echo "build"
                - bash ./toolchain/scripts/deployinfra.sh
            post_build:
              commands:
                - echo "post_build start"


  DeployDBCodeBuildProject:
